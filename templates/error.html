<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Could not create document · Airtable to Word</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; color: #172033; background: #f6f7f9; font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: min(100% - 2rem, 620px); margin: 10vh auto 0; padding: 2rem; background: #fff; border: 1px solid #e4e7ec; border-radius: 14px; box-shadow: 0 1px 2px rgb(16 24 40 / 4%); }
    .eyebrow { margin: 0 0 .6rem; color: #d92d20; font-size: .75rem; font-weight: 750; letter-spacing: .1em; text-transform: uppercase; }
    h1 { margin: 0; color: #101828; font-size: 1.65rem; letter-spacing: -.025em; }
    p { color: #667085; line-height: 1.6; }
    a { display: inline-flex; margin-top: .35rem; padding: .75rem 1rem; color: #fff; background: #2563eb; border-radius: 8px; font-weight: 650; text-decoration: none; }
    a:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Export failed</p>
    <h1>Could not create the document</h1>
    <p>{{ message }}</p>
    <a href="/">Return to records</a>
  </main>
</body>
</html>
